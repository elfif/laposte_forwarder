# Template. Copy to compose.yaml (gitignored), then per account:
#   1. duplicate the "alice" service block and its two entries under "secrets:"
#   2. set LAPOSTE_USER / GMAIL_USER and the secret names
#   3. create the two password files in ./secrets/
#      (dir chmod 700, files chmod 644 -- the container reads them as "nobody")
# See docs/DEPLOY.md for the full rollout procedure. Do NOT enable
# DELETE_AFTER_FORWARD before completing the validation phases there.
#
# Never add a "ports:" section: the image bundles a web UI (servimapsync)
# that must not be exposed on a box holding mail credentials.

# Everything common to all accounts lives in this anchor.
x-forwarder: &forwarder
  # Pinned by tag AND digest: upstream rebuilds and repushes tags, so a tag
  # alone is not immutable. To upgrade, see docs/RUNBOOK.md.
  # NOTE: this image is amd64-only. On an arm64 host, build the local
  # ./Dockerfile instead (replace "image:" with "build: .").
  image: gilleslamiral/imapsync:2.319@sha256:161336e1a6db587bc42ea1126cfc9b6afa67ea92b408ea4c4454f7f771561aa4
  restart: unless-stopped
  # Real PID 1: forwards SIGTERM to the loop and reaps zombies.
  init: true
  read_only: true
  # imapsync unconditionally creates /var/tmp/uid_<uid> at startup (its HOME
  # is /var/tmp), so both paths must be writable under read_only.
  tmpfs:
    - /tmp
    - /var/tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    - ./bin/laposte-forward:/usr/local/bin/laposte-forward:ro
  command: ["/usr/local/bin/laposte-forward", "--loop"]
  healthcheck:
    # Unhealthy when no successful sync for 5 minutes. The wrapper writes the
    # heartbeat only after a sync succeeds, so a container stuck in auth
    # failures shows up in `docker compose ps` even though it keeps running.
    test: ["CMD-SHELL", "test -f /tmp/heartbeat && test $(( $(date +%s) - $(cat /tmp/heartbeat) )) -lt 300"]
    interval: 60s
    timeout: 10s
    retries: 3
    start_period: 2m
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  alice:
    <<: *forwarder
    container_name: laposte-fwd-alice
    environment:
      LAPOSTE_USER: alice@laposte.net
      GMAIL_USER: alice.example@gmail.com
      PASSFILE1: /run/secrets/alice_laposte
      PASSFILE2: /run/secrets/alice_gmail
      # Only mail that ARRIVED within this many days is forwarded (IMAP date
      # granularity makes the effective window 24-48h at the default of 1).
      WINDOW_DAYS: "1"
      INTERVAL_SECONDS: "60"
      # Keep false until this account has passed validation (docs/DEPLOY.md).
      # Once true, laposte messages are deleted after the confirmed copy and
      # Gmail holds the only remaining copy.
      DELETE_AFTER_FORWARD: "false"
      # Optional dead-man's-switch (e.g. https://hc-ping.com/<uuid>), pinged
      # after every successful sync. Alerts you when forwarding stops.
      HEALTHCHECK_URL: ""
    secrets:
      - alice_laposte
      - alice_gmail

  # bob:
  #   <<: *forwarder
  #   container_name: laposte-fwd-bob
  #   environment:
  #     LAPOSTE_USER: bob@laposte.net
  #     GMAIL_USER: bob.example@gmail.com
  #     PASSFILE1: /run/secrets/bob_laposte
  #     PASSFILE2: /run/secrets/bob_gmail
  #     WINDOW_DAYS: "1"
  #     INTERVAL_SECONDS: "60"
  #     DELETE_AFTER_FORWARD: "false"
  #     HEALTHCHECK_URL: ""
  #   secrets:
  #     - bob_laposte
  #     - bob_gmail

secrets:
  alice_laposte:
    file: ./secrets/alice_laposte.txt
  alice_gmail:
    file: ./secrets/alice_gmail.txt
  # bob_laposte:
  #   file: ./secrets/bob_laposte.txt
  # bob_gmail:
  #   file: ./secrets/bob_gmail.txt
